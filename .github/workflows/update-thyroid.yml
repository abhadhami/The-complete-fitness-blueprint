name: Refine Thyroid Fitness Assessment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-thyroid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-thyroid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update only Thyroid Fitness assessment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          new_goals = """'Thyroid Fitness':['Fat Loss / Weight Management','Healthy Weight Gain','Weight Maintenance','Muscle Gain & Strength','Muscle Preservation','Body Recomposition','Cardiovascular Fitness','Energy & Exercise Capacity','Mobility & Functional Fitness','Return to Consistent Training','Not Sure — Need Assessment']"""
          new_questions = """'Thyroid Fitness':[['status','Thyroid profile',['Hypothyroidism','Hyperthyroidism','Other / thyroid condition','Not sure / prefer not to say']],['weightTrend','Current weight trend',['Weight gain','Weight loss','Weight stable','Difficulty gaining weight','Difficulty losing weight','Not sure']],['followup','Medical follow-up / treatment',['Regular medical follow-up','Currently under treatment','Recently changed treatment','Not sure','Prefer not to say']],['energy','Energy / fatigue level',['Good','Variable','Frequently low','Currently limited']],['capacity','Current exercise tolerance',['Good','Moderate','Low','Currently restricted']],['goal','Primary fitness goal',['Fat loss / weight management','Healthy weight gain','Weight maintenance','Muscle gain & strength','Muscle preservation','Body recomposition','Cardiovascular fitness','General fitness & conditioning','Mobility & functional fitness','Return to consistent training']]]"""
          pattern_goals = r"'Thyroid Fitness':\[[^\n]*\](?=,\n'PCOS / PCOD')"
          pattern_questions = r"'Thyroid Fitness':\[\[.*?\]\](?=,\n'PCOS / PCOD')"
          text, n1 = re.subn(pattern_goals, new_goals, text, count=1)
          text, n2 = re.subn(pattern_questions, new_questions, text, count=1, flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Expected one Thyroid replacement; goals={n1}, questions={n2}')
          for required in ['Hypothyroidism','Hyperthyroidism','Healthy Weight Gain',"'Muscle Building':"]:
              if required not in text:
                  raise SystemExit(f'Missing required content: {required}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit Thyroid update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update Thyroid Fitness assessment" && git push; fi
